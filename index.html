<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayuduki - Premium Bot Access</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Impact', 'Arial Black', sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
            letter-spacing: 0.5px;
            -webkit-user-select: none;
            user-select: none;
        }

        .header {
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 32px;
            margin: 5px 0;
            color: #ffcc00;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }

        .header p {
            font-family: system-ui, sans-serif;
            color: #888888;
            font-size: 13px;
            margin-top: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .currency-switcher {
            display: inline-flex;
            background: #161616;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 2px solid #222222;
        }

        .currency-btn {
            background: none;
            border: none;
            color: #666666;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .currency-btn.active {
            background: #ffcc00;
            color: #000000;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .tariffs {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto 35px auto;
        }

        .tariff-card {
            background-color: #121212;
            border: 2px solid #222222;
            border-radius: 14px;
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }

        .tariff-card.selected {
            border-color: #ffcc00;
            background-color: #1a1913;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
        }

        .tariff-info .title {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .tariff-card.selected .tariff-info .title {
            color: #ffcc00;
        }

        .tariff-info .desc {
            font-family: system-ui, sans-serif;
            font-size: 12px;
            color: #555555;
            font-weight: 500;
        }

        .tariff-price {
            font-size: 24px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }

        .features {
            font-family: system-ui, sans-serif;
            text-align: left;
            max-width: 350px;
            margin: 0 auto 30px auto;
            background: #121212;
            border: 1px solid #222222;
            padding: 18px;
            border-radius: 12px;
            font-size: 13px;
            color: #aaaaaa;
        }
        .features div { 
            margin-bottom: 10px; 
            display: flex;
            align-items: center;
        }
        .features div:last-child { margin-bottom: 0; }
        .features div::before { 
            content: "✦"; 
            color: #ffcc00; 
            font-weight: bold; 
            margin-right: 10px;
            text-shadow: 0 0 5px #ffcc00;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AYUDUKI</h1>
        <p>⚡ Автоответчик для твоего бизнеса 24/7 ⚡</p>
    </div>

    <div class="currency-switcher">
        <button class="currency-btn active" id="btn-rub" onclick="setCurrency('RUB')">РУБЛИ (₽)</button>
        <button class="currency-btn" id="btn-stars" onclick="setCurrency('STARS')">ЗВЕЗДЫ (⭐️)</button>
    </div>

    <div class="tariffs">
        <div class="tariff-card selected" id="tariff-week">
            <div class="tariff-info">
                <div class="title">1 НЕДЕЛЯ</div>
                <div class="desc">БЫСТРЫЙ ТЕСТ СИСТЕМЫ</div>
            </div>
            <div class="tariff-price" id="price-week">150 ₽</div>
        </div>

        <div class="tariff-card" id="tariff-month">
            <div class="tariff-info">
                <div class="title">1 МЕСЯЦ</div>
                <div class="desc">ПОЛНЫЙ БЕЗЛИМИТНЫЙ ДОСТУП</div>
            </div>
            <div class="tariff-price" id="price-month">200 ₽</div>
        </div>
    </div>

    <div class="features">
        <div>Мгновенный автоответ клиентам без задержек</div>
        <div>Полная симуляция печати текста в чате</div>
        <div>Подключение личных ИИ-скриптов продаж</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        tg.MainButton.setParams({
            text_color: "#000000",
            button_color: "#ffcc00"
        });

        let currentCurrency = 'RUB';
        let currentTariff = 'week';

        const prices = {
            RUB: { week: '150 ₽', month: '200 ₽' },
            STARS: { week: '80 ⭐️', month: '110 ⭐️' }
        };

        tg.MainButton.text = "АКТИВИРОВАТЬ ПОДПИСКУ (150 ₽)";
        tg.MainButton.show();

        function setCurrency(currency) {
            currentCurrency = currency;
            document.getElementById('btn-rub').classList.toggle('active', currency === 'RUB');
            document.getElementById('btn-stars').classList.toggle('active', currency === 'STARS');

            document.getElementById('price-week').innerText = prices[currency].week;
            document.getElementById('price-month').innerText = prices[currency].month;

            updateMainButton();
        }

        function updateMainButton() {
            const priceText = prices[currentCurrency][currentTariff];
            tg.MainButton.text = `АКТИВИРОВАТЬ ПОДПИСКУ (${priceText})`;
        }

        const weekCard = document.getElementById('tariff-week');
        const monthCard = document.getElementById('tariff-month');

        function handleWeekSelect() {
            currentTariff = 'week';
            weekCard.classList.add('selected');
            monthCard.classList.remove('selected');
            updateMainButton();
        }

        function handleMonthSelect() {
            currentTariff = 'month';
            monthCard.classList.add('selected');
            weekCard.classList.remove('selected');
            updateMainButton();
        }

        weekCard.addEventListener('click', handleWeekSelect);
        weekCard.addEventListener('touchstart', handleWeekSelect);

        monthCard.addEventListener('click', handleMonthSelect);
        monthCard.addEventListener('touchstart', handleMonthSelect);

        tg.MainButton.onClick(function() {
            const orderData = {
                tariff: currentTariff,
                currency: currentCurrency,
                userId: tg.initDataUnsafe?.user?.id || 0
            };
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        });
    </script>
</body>
</html>

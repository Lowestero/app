<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayuduki</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header { margin-bottom: 25px; }
        .header h1 { font-size: 32px; margin: 5px 0; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; }
        .header p { color: #888888; font-size: 13px; text-transform: uppercase; font-weight: bold; }
        
        .section-title { font-size: 14px; color: #ffcc00; text-align: left; margin: 20px auto 10px auto; max-width: 400px; font-weight: bold; text-transform: uppercase; }
        
        .tariffs { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
        
        /* Кнопки сделаны как полноценные крупные элементы */
        .pay-button { 
            background-color: #121212; 
            border: 2px solid #222222; 
            border-radius: 14px; 
            padding: 18px 22px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            text-align: left;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.1s, border-color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .pay-button:active {
            transform: scale(0.98);
            border-color: #ffcc00;
            background-color: #1a1913;
        }
        .title { font-size: 18px; font-weight: bold; color: #ffffff; }
        .desc { font-size: 12px; color: #666666; margin-top: 3px; }
        .price { font-size: 20px; font-weight: bold; color: #ffcc00; }

        .features { text-align: left; max-width: 350px; margin: 30px auto 0 auto; background: #121212; border: 1px solid #222222; padding: 15px; border-radius: 12px; font-size: 13px; color: #aaaaaa; }
        .features div { margin-bottom: 8px; display: flex; align-items: center; }
        .features div:last-child { margin-bottom: 0; }
        .features div::before { content: "✦"; color: #ffcc00; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AYUDUKI</h1>
        <p>⚡ Автоответчик для твоего бизнеса 24/7 ⚡</p>
    </div>

    <!-- ТАРИФЫ В РУБЛЯХ -->
    <div class="section-title">Оплата в Рублях (₽)</div>
    <div class="tariffs">
        <button class="pay-button" onclick="sendOrder('week', 'RUB')">
            <div>
                <div class="title">1 НЕДЕЛЯ — ₽</div>
                <div class="desc">БЫСТРЫЙ ТЕСТ СИСТЕМЫ</div>
            </div>
            <div class="price">150 ₽</div>
        </button>

        <button class="pay-button" onclick="sendOrder('month', 'RUB')">
            <div>
                <div class="title">1 МЕСЯЦ — ₽</div>
                <div class="desc">ПОЛНЫЙ БЕЗЛИМИТНЫЙ ДОСТУП</div>
            </div>
            <div class="price">200 ₽</div>
        </button>
    </div>

    <!-- ТАРИФЫ В ЗВЕЗДАХ -->
    <div class="section-title">Оплата в Звездах (⭐️)</div>
    <div class="tariffs">
        <button class="pay-button" onclick="sendOrder('week', 'STARS')">
            <div>
                <div class="title">1 НЕДЕЛЯ — ⭐️</div>
                <div class="desc">БЫСТРЫЙ ТЕСТ СИСТЕМЫ</div>
            </div>
            <div class="price">80 ⭐️</div>
        </button>

        <button class="pay-button" onclick="sendOrder('month', 'STARS')">
            <div>
                <div class="title">1 МЕСЯЦ — ⭐️</div>
                <div class="desc">ПОЛНЫЙ БЕЗЛИМИТНЫЙ ДОСТУП</div>
            </div>
            <div class="price">110 ⭐️</div>
        </button>
    </div>

    <div class="features">
        <div>Мгновенный автоответ клиентам без задержек</div>
        <div>Полная симуляция печати текста в чате</div>
        <div>Подключение личных ИИ-скриптов продаж</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Скрываем большую кнопку ТГ, так как теперь платим напрямую по клику на карточки!
        tg.MainButton.hide();

        function sendOrder(tariff, currency) {
            // При клике на любую кнопку данные мгновенно улетают боту, а приложение закрывается
            tg.sendData(JSON.stringify({ tariff: tariff, currency: currency }));
            tg.close();
        }
    </script>
</body>
</html>
